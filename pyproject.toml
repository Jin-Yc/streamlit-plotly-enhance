[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-plotly-enhance"
version = "0.1.0"
description = "Streamlit Components v2 helpers for Plotly heatmap-like cell events."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jin-Yc" }
]
dependencies = [
  "streamlit>=1.51",
  "plotly>=5.20",
]
keywords = ["streamlit", "plotly", "heatmap", "events", "components-v2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Streamlit",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/Jin-Yc/streamlit-plotly-enhance"
Repository = "https://github.com/Jin-Yc/streamlit-plotly-enhance"
Issues = "https://github.com/Jin-Yc/streamlit-plotly-enhance/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamlit_plotly_enhance = [
  "pyproject.toml",
  "frontend/build/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
